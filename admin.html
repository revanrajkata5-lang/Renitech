<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RENI Tech Services — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--bg:#2F2F2F;
--bg-deep:#252423;
--surface:#3A3836;
--surface-2:#454340;
--line:#524F49;
--teal:#FFCB74;
--text:#F6F6F6;
--muted:#B7B2A8;
--muted-2:#85807A;
--on-gold:#232120;
--good:#7FBF7F;
--bad:#E5847A;
--display:'Space Grotesk',sans-serif;
--body:'Inter',sans-serif;
--mono:'JetBrains Mono',monospace;
}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;}
.wrap{max-width:1200px;margin:0 auto;padding:32px 24px 80px;}
h1{font-family:var(--display);font-weight:700;font-size:26px;}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:16px;}
p.muted{color:var(--muted);font-size:14px;}
a{color:var(--teal);}

/* ---------- Login screen ---------- */
#loginScreen{
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.login-card{
background:var(--surface);border:1px solid var(--line);border-radius:16px;
padding:40px;width:100%;max-width:380px;box-shadow:0 24px 48px rgba(0,0,0,0.35);
}
.login-card h1{margin-bottom:6px;}
.login-card p.muted{margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-family:var(--mono);}
.field input{
width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
background:var(--bg-deep);color:var(--text);font-size:14.5px;
}
.field input:focus{outline:2px solid var(--teal);outline-offset:1px;}
.btn{
width:100%;padding:13px;border-radius:10px;border:none;font-weight:600;font-size:15px;
background:linear-gradient(135deg,#FFDA9B,var(--teal));color:var(--on-gold);cursor:pointer;
transition:transform .2s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn-outline{
background:none;border:1px solid var(--line);color:var(--text);width:auto;padding:9px 16px;font-size:13.5px;
}
#loginStatus{margin-top:14px;font-size:13.5px;min-height:18px;}
#loginStatus.error{color:var(--bad);}
#loginStatus.success{color:var(--good);}

/* ---------- Dashboard ---------- */
#dashboard{display:none;}
.top-bar{
display:flex;justify-content:space-between;align-items:center;
padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:32px;flex-wrap:wrap;gap:16px;
}
.top-bar .who{font-size:13px;color:var(--muted);margin-top:2px;}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.tab-btn{
padding:10px 18px;border-radius:100px;border:1px solid var(--line);background:none;color:var(--muted);
cursor:pointer;font-size:14px;font-weight:500;transition:all .2s ease;
}
.tab-btn.active{background:rgba(255,203,116,0.14);border-color:var(--teal);color:var(--teal);}
.panel{display:none;}
.panel.active{display:block;}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;}
table{width:100%;border-collapse:collapse;min-width:760px;}
th{
text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;
color:var(--muted-2);padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);
}
td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top;background:var(--bg-deep);}
tr:last-child td{border-bottom:none;}
.pill{
display:inline-block;padding:4px 12px;border-radius:100px;font-size:12px;font-weight:600;
background:var(--surface-2);color:var(--muted);
}
.pill.new{background:rgba(255,203,116,0.16);color:var(--teal);}
.pill.contacted,.pill.reviewing{background:rgba(217,211,196,0.16);color:var(--muted);}
.pill.closed,.pill.quoted{background:rgba(127,191,127,0.14);color:var(--good);}
select.status-select{
background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;
padding:6px 8px;font-size:13px;margin-top:6px;
}
.row-actions{display:flex;gap:8px;margin-top:8px;}
.small-btn{
background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;
font-size:12px;cursor:pointer;
}
.small-btn:hover{border-color:var(--bad);color:var(--bad);}
.empty-state{padding:48px 16px;text-align:center;color:var(--muted);}
.refresh-row{display:flex;justify-content:flex-end;margin-bottom:12px;}
.services-list{font-size:13px;color:var(--muted);}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-card">
<h1>RENI Admin</h1>
<p class="muted">Sign in with your admin account to view contacts and orders.</p>
<form id="loginForm">
<div class="field">
<label for="login-email">Email</label>
<input type="email" id="login-email" required autocomplete="username">
</div>
<div class="field">
<label for="login-password">Password</label>
<input type="password" id="login-password" required autocomplete="current-password">
</div>
<button type="submit" class="btn" id="login-submit">Sign In</button>
<p id="loginStatus"></p>
</form>
</div>
</div>

<div id="dashboard">
<div class="wrap">
<div class="top-bar">
<div>
<h1>RENI Admin</h1>
<p class="who" id="whoAmI"></p>
</div>
<button class="btn btn-outline" id="logoutBtn">Sign Out</button>
</div>

<div class="tabs">
<button class="tab-btn active" data-panel="contactsPanel">Contact Messages</button>
<button class="tab-btn" data-panel="ordersPanel">Quote Requests / Orders</button>
</div>

<div class="panel active" id="contactsPanel">
<div class="refresh-row"><button class="small-btn" id="refreshContacts">Refresh</button></div>
<div class="table-wrap">
<table>
<thead>
<tr><th>Received</th><th>Name</th><th>Contact</th><th>Message</th><th>Status</th><th></th></tr>
</thead>
<tbody id="contactsBody"></tbody>
</table>
</div>
<div class="empty-state" id="contactsEmpty" style="display:none;">No contact messages yet.</div>
</div>

<div class="panel" id="ordersPanel">
<div class="refresh-row"><button class="small-btn" id="refreshOrders">Refresh</button></div>
<div class="table-wrap">
<table>
<thead>
<tr><th>Received</th><th>Customer</th><th>Services</th><th>Estimate</th><th>Status</th><th></th></tr>
</thead>
<tbody id="ordersBody"></tbody>
</table>
</div>
<div class="empty-state" id="ordersEmpty" style="display:none;">No quote requests yet.</div>
</div>

</div>
</div>

<script>
// ---- Supabase project settings (the anon/publishable key is safe to expose client-side;
// access to real data is restricted by Row Level Security to signed-in admins only) ----
const SUPABASE_URL = 'https://gjpwtgklpdeoiijelnrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tjXofOu6uC1knv59KrNM0Q_dldRjaiX';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');
const loginForm = document.getElementById('loginForm');
const loginStatus = document.getElementById('loginStatus');
const loginSubmit = document.getElementById('login-submit');
const whoAmI = document.getElementById('whoAmI');

function fmtDate(iso){
const d = new Date(iso);
return d.toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' });
}
function fmtINR(n){
return '₹' + Number(n).toLocaleString('en-IN');
}
function escapeHtml(str){
if(str === null || str === undefined) return '';
return String(str).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Auth ---------- */
loginForm.addEventListener('submit', async (e)=>{
e.preventDefault();
const email = document.getElementById('login-email').value.trim();
const password = document.getElementById('login-password').value;
loginSubmit.disabled = true;
loginStatus.textContent = 'Signing in...';
loginStatus.className = '';

const { data, error } = await sb.auth.signInWithPassword({ email, password });
loginSubmit.disabled = false;
if(error){
loginStatus.textContent = error.message;
loginStatus.className = 'error';
return;
}
loginStatus.textContent = 'Signed in.';
loginStatus.className = 'success';
showDashboard(data.user);
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
await sb.auth.signOut();
dashboard.style.display = 'none';
loginScreen.style.display = 'flex';
loginForm.reset();
});

async function checkSession(){
const { data } = await sb.auth.getSession();
if(data.session && data.session.user){
showDashboard(data.session.user);
}
}

function showDashboard(user){
loginScreen.style.display = 'none';
dashboard.style.display = 'block';
whoAmI.textContent = `Signed in as ${user.email}`;
loadContacts();
loadOrders();
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
btn.addEventListener('click', ()=>{
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
btn.classList.add('active');
document.getElementById(btn.dataset.panel).classList.add('active');
});
});

/* ---------- Contacts ---------- */
async function loadContacts(){
const body = document.getElementById('contactsBody');
const empty = document.getElementById('contactsEmpty');
body.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';

const { data, error } = await sb
.from('contacts')
.select('*')
.order('created_at', { ascending:false });

if(error){
body.innerHTML = `<tr><td colspan="6">Error loading contacts: ${escapeHtml(error.message)}</td></tr>`;
return;
}

if(!data || data.length === 0){
body.innerHTML = '';
empty.style.display = 'block';
return;
}
empty.style.display = 'none';

body.innerHTML = data.map(row => `
<tr data-id="${row.id}">
<td>${fmtDate(row.created_at)}</td>
<td>${escapeHtml(row.name)}</td>
<td>${escapeHtml(row.email)}${row.phone ? '<br>' + escapeHtml(row.phone) : ''}</td>
<td style="max-width:280px;">${escapeHtml(row.message) || '<span class="muted">—</span>'}</td>
<td>
<span class="pill ${row.status}">${escapeHtml(row.status)}</span><br>
<select class="status-select" data-id="${row.id}" data-table="contacts">
<option value="new" ${row.status==='new'?'selected':''}>new</option>
<option value="contacted" ${row.status==='contacted'?'selected':''}>contacted</option>
<option value="closed" ${row.status==='closed'?'selected':''}>closed</option>
</select>
</td>
<td><div class="row-actions"><button class="small-btn delete-btn" data-id="${row.id}" data-table="contacts">Delete</button></div></td>
</tr>
`).join('');

attachRowHandlers();
}

/* ---------- Orders ---------- */
async function loadOrders(){
const body = document.getElementById('ordersBody');
const empty = document.getElementById('ordersEmpty');
body.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';

const { data, error } = await sb
.from('orders')
.select('*')
.order('created_at', { ascending:false });

if(error){
body.innerHTML = `<tr><td colspan="6">Error loading orders: ${escapeHtml(error.message)}</td></tr>`;
return;
}

if(!data || data.length === 0){
body.innerHTML = '';
empty.style.display = 'block';
return;
}
empty.style.display = 'none';

body.innerHTML = data.map(row => {
const services = Array.isArray(row.services) ? row.services : [];
return `
<tr data-id="${row.id}">
<td>${fmtDate(row.created_at)}</td>
<td>${escapeHtml(row.customer_name)}<br><span class="muted">${escapeHtml(row.customer_email)}</span>${row.customer_phone ? '<br>' + escapeHtml(row.customer_phone) : ''}</td>
<td class="services-list">${services.map(escapeHtml).join(', ')}</td>
<td>${fmtINR(row.estimate_low)}–${fmtINR(row.estimate_high)}</td>
<td>
<span class="pill ${row.status}">${escapeHtml(row.status)}</span><br>
<select class="status-select" data-id="${row.id}" data-table="orders">
<option value="new" ${row.status==='new'?'selected':''}>new</option>
<option value="reviewing" ${row.status==='reviewing'?'selected':''}>reviewing</option>
<option value="quoted" ${row.status==='quoted'?'selected':''}>quoted</option>
<option value="closed" ${row.status==='closed'?'selected':''}>closed</option>
</select>
</td>
<td><div class="row-actions"><button class="small-btn delete-btn" data-id="${row.id}" data-table="orders">Delete</button></div></td>
</tr>
`;
}).join('');

attachRowHandlers();
}

function attachRowHandlers(){
document.querySelectorAll('.status-select').forEach(sel=>{
sel.addEventListener('change', async ()=>{
const id = sel.dataset.id;
const table = sel.dataset.table;
const { error } = await sb.from(table).update({ status: sel.value }).eq('id', id);
if(error){
alert('Could not update status: ' + error.message);
return;
}
if(table === 'contacts') loadContacts(); else loadOrders();
});
});

document.querySelectorAll('.delete-btn').forEach(btn=>{
btn.addEventListener('click', async ()=>{
if(!confirm('Delete this entry permanently?')) return;
const id = btn.dataset.id;
const table = btn.dataset.table;
const { error } = await sb.from(table).delete().eq('id', id);
if(error){
alert('Could not delete: ' + error.message);
return;
}
if(table === 'contacts') loadContacts(); else loadOrders();
});
});
}

document.getElementById('refreshContacts').addEventListener('click', loadContacts);
document.getElementById('refreshOrders').addEventListener('click', loadOrders);

checkSession();
</script>
</body>
</html>
