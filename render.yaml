databases:
  - name: renitech-db
    plan: free

services:
  - type: web
    name: renitech-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: renitech-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
